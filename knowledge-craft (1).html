<head>

<title>Knowledge Craft</title>

<style>
:root{--ink:#1a1a1a;--stone:#7b7b7b;--hi:#c9c9c9;--lo:#3a3a3a;--grass:#5fa832;--dirt:#7a5230;--gold:#ffd23f}

body{margin:0;min-height:100vh;background:#2b1d10;background-image:linear-gradient(45deg,#33230f 25%,transparent 25%,transparent 75%,#33230f 75%),linear-gradient(45deg,#33230f 25%,transparent 25%,transparent 75%,#33230f 75%);background-size:32px 32px;background-position:0 0,16px 16px;font-family:'Press Start 2P','Courier New',monospace;color:#fff;display:flex;justify-content:center;padding:12px}

.btn:hover:not(:disabled){background:#6f7fc4;box-shadow:inset 3px 3px 0 #b6c1ff,inset -3px -3px 0 #3a4684}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.surp{background:#5aa02c;box-shadow:inset 3px 3px 0 #a5e06f,inset -3px -3px 0 #2c5a14}

#c{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated}

.bub.on{opacity:1;transform:none}
.bub b{display:block;color:#2a6;margin-bottom:3px}
.bub::after{content:"";position:absolute;top:100%;width:10px;height:10px;background:#fff;border:3px solid #000;border-top:0;border-left:0;transform:rotate(45deg) translate(-6px,-6px)}
#bS{left:33%;transform:translate(-82%,6px)}#bS.on{transform:translate(-82%,0)}#bS::after{left:80%}
#bA{left:47%;transform:translate(-14%,6px)}#bA.on{transform:translate(-14%,0)}#bA::after{left:14%}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-80px);background:#000b;border:3px solid var(--gold);padding:10px 14px;font-size:clamp(7px,1.6vw,11px);color:var(--gold);transition:.35s;white-space:nowrap}

#ov{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:16px}

#ov p{margin:0;font-size:clamp(7px,1.5vw,11px);line-height:2;max-width:520px}

#panel .q{font-size:clamp(10px,1.9vw,14px);line-height:1.7;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .btn{text-align:left;min-height:46px}
.opts .btn.ok{background:#3f9d2e;box-shadow:inset 3px 3px 0 #8fe27f,inset -3px -3px 0 #1d5a14}
.opts .btn.no{background:#b33;box-shadow:inset 3px 3px 0 #ff8a8a,inset -3px -3px 0 #661a1a}
.fact{margin-top:12px;font-size:9px;line-height:1.8;color:#d6f5c8;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

@media(max-width:560px){.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.bub,#toast{transition:none}}
</style>
</head>

function kick(t){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
 gn.gain.setValueAtTime(.35,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+.25)}
function hat(t){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
 const gn=AC.createGain();gn.gain.setValueAtTime(.06,t);gn.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random(),.08)}
function thunder(){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;const gn=AC.createGain();
 gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.8,t+.1);gn.gain.exponentialRampToValueAtTime(.001,t+2.4);
 s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random());s.stop(t+2.6)}
function sched(){
 if(!AC)return;const T=TR[curT],sd=60/T.bpm/2;
 while(nextT<AC.currentTime+.3){
  const s=step,t=nextT,b=s%8,[cr,mn]=T.ch[Math.floor(s/8)%4],r=T.root*Math.pow(2,cr/12);
  if(b===0){[0,mn?3:4,7].forEach(x=>tone(r*2*Math.pow(2,x/12),t,sd*8,T.pad,.03,.5));tone(r,t,sd*3.5,T.bass||'triangle',.12)}
  if(b===4)tone(r*1.5,t,sd*3,T.bass||'triangle',.08);
  if(Math.random()<T.p){mi=clamp(mi+Math.floor(rnd(-2,3)),0,T.sc.length-1);
   tone(T.root*T.oct*Math.pow(2,T.sc[mi]/12),t,sd*(1+Math.random()*2.5),T.lead,.055)}
  if(T.drums){if(b%4===0)kick(t);if(b%2===1)hat(t)}
  nextT+=sd;step++;
 }
}
function chime(){if(!AC)return;const t=AC.currentTime;[0,4,7,12].forEach((x,i)=>tone(523.25*Math.pow(2,x/12),t+i*.07,.3,'triangle',.08))}

/* ---------- Scene ---------- */
const clouds=Array.from({length:8},(_,i)=>({x:i*60+rnd(0,30),y:8+hash(i)*44,w:28+hash(i+9)*34}));
const rain=Array.from({length:140},()=>({x:rnd(0,W+40),y:rnd(0,H),s:Math.random()}));
const snow=Array.from({length:120},()=>({x:rnd(0,W),y:rnd(0,H),s:Math.random()}));
const flies=Array.from({length:14},(_,i)=>({x:hash(i)*W,y:GY-10-hash(i+3)*50,p:hash(i+5)*6}));
let scroll=0,time=0,flash=0,ltimer=3,boltX=100;
const rect=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const snowBlend=(c,k=.85)=>mix(c,[236,246,252],cs.snow*k);

function drawSky(){
 for(let y=0;y<GY+6;y+=6){rect(0,y,W,6,mix(cs.top,cs.bot,y/GY))}
 if(cs.stars>.04){g.globalAlpha=cs.stars;for(let i=0;i<60;i++){const tw=.5+.5*Math.sin(time*2+i);g.globalAlpha=cs.stars*(.35+.65*tw);rect(hash(i)*W,hash(i+50)*(GY-30),i%7===0?2:1,i%7===0?2:1,'#fff')}g.globalAlpha=1}
 const sa=(1-cs.stars)*(1-Math.min(1,cs.rain))*(1-cs.snow*.6);
 if(sa>.03){g.globalAlpha=sa;rect(244,20,20,20,'#fff4a8');rect(247,23,14,14,'#ffd93a');g.globalAlpha=1}
 if(cs.stars>.05){g.globalAlpha=cs.stars;rect(244,18,16,16,'#e8ecf5');rect(248,22,4,4,'#b9c0d4');rect(254,28,3,3,'#b9c0d4');g.globalAlpha=1}
 clouds.forEach((c,i)=>{const a=clamp((cs.cloud-i/8)*8,0,1);if(a<=0)return;
  const x=(((c.x-scroll*.1-time*3)%(W+80))+(W+80))%(W+80)-40,v=Math.round(255-Math.min(1,cs.rain)*115-cs.stars*150);
  g.globalAlpha=a*.95;const col=`rgb(${v},${v},${Math.min(255,v+8)})`;
  rect(x,c.y,c.w,8,col);rect(x+6,c.y-6,c.w*.6,6,col);rect(x+c.w*.5,c.y+8,c.w*.4,4,col);g.globalAlpha=1})
}
function drawHills(){
 const col=snowBlend([74,134,56],.8);
 for(let x=-8;x<W+8;x+=8){const wx=x+scroll*.2,i=Math.floor(wx/8),h=20+Math.floor(((Math.sin(wx*.021)*.5+.5)*34+hash(i)*10)/8)*8;
  rect(x-(scroll*.2%8),GY-h,8,h,col);rect(x-(scroll*.2%8),GY-h,8,2,snowBlend([96,160,70],.9))}
}
function leaves(x,y,w,h){const a=snowBlend([46,125,50],.9),b=snowBlend([62,150,62],.9);rect(x,y,w,h,a);rect(x+2,y+2,w-4,h-4,b);rect(x+w*.3,y+h*.4,4,4,a)}
function drawTrees(par,spacing,k){
 const s=scroll*par,i0=Math.floor(s/spacing)-1;
 for(let i=i0;i<i0+Math.ceil(W/spacing)+3;i++){
  if(hash(i*(k+1))<.25)continue;
  const sx=Math.round(i*spacing+hash(i+k)*spacing*.6-s),big=k===1,tw=big?6:4,th=big?30:16;
  rect(sx,GY-th,tw,th,'#6b4a2a');rect(sx+1,GY-th,1,th,'#82603a');
  const lw=big?34:20,lh=big?20:11;leaves(sx+tw/2-lw/2,GY-th-lh+4,lw,lh);
  leaves(sx+tw/2-lw*.3,GY-th-lh-6,lw*.6,lh*.6)
 }
}
function drawGround(){
 const grass=snowBlend([96,168,52],.9),grass2=snowBlend([118,190,66],.9);
 const off=scroll%8,b0=Math.floor(scroll/8);
 for(let k=-1;k<=W/8+1;k++){
  const x=k*8-off,bi=b0+k;
  rect(x,GY,8,6,grass);rect(x,GY,8,2,grass2);rect(x+(hash(bi)*5|0),GY+2,2,2,grass2);
  for(let r=0;r<6;r++){const y=GY+6+r*8,h=hash(bi*7+r*13),c=h<.33?[122,82,48]:h<.66?[106,70,40]:[134,92,56];
   rect(x,y,8,8,`rgb(${c})`);rect(x+(h*5|0),y+(h*40%5|0),2,2,'rgb(90,58,32)');rect(x,y,8,1,'rgba(0,0,0,.12)')}
 }
}
function drawFlowers(){
 const sp=22,i0=Math.floor(scroll/sp)-1;
 for(let i=i0;i<i0+W/sp+3;i++){
  const h=hash(i*3.3);if(h<.45)continue;const x=Math.round(i*sp+h*10-scroll);
  if(cs.snow>.6){rect(x,GY-3,3,3,'#fff');continue}
  rect(x+1,GY-5,1,5,'#3f8a2a');const c=['#e63946','#ffd23f','#ff7ac6','#7ab8ff'][i&3];rect(x,GY-8,3,3,c);rect(x+1,GY-7,1,1,'#fff')
 }
}
function drawChar(x,ph,c){
 const sw=Math.sin(time*7+ph)*3,bob=Math.abs(Math.sin(time*7+ph))*1.2,hy=GY-32-bob;
 const arm=(dx,col)=>{rect(x+dx,hy+9,4,5,c.shirt);rect(x+dx,hy+14,4,7,col)};
 g.globalAlpha=1;
 // back leg + arm
 rect(x-sw*1.2,GY-12,4,10,'#000a');rect(x-sw*1.2,GY-12,4,10,c.pantsD);rect(x-sw*1.2,GY-2,4,2,'#444');
 arm(-sw*.9,c.skinD);
 // front leg
 rect(x+sw*1.2,GY-12,4,10,c.pants);rect(x+sw*1.2,GY-2,4,2,'#666');
 // body
 rect(x,hy+8,4,12,c.shirt);rect(x,hy+18,4,2,c.pants);
 // head
 const hx=x-2;rect(hx,hy,8,8,c.skin);
 rect(hx,hy,8,2,c.hair);rect(hx,hy,3,c.long?13:8,c.hair);rect(hx+3,hy+2,2,1,c.hair);
 rect(hx+4,hy+3,2,2,'#fff');rect(hx+5,hy+3,1,2,c.eye);rect(hx+5,hy+6,2,1,c.mouth);rect(hx+7,hy+4,1,2,c.skinD);
 // front arm
 arm(sw*.9,c.skin);
}
const STEVE={skin:'#c68662',skinD:'#a96f4d',hair:'#3b2a1a',shirt:'#00a8a8',pants:'#3a3fa0',pantsD:'#2c3080',eye:'#3a2a8a',mouth:'#7a3a2a'};
const ALEX={skin:'#e8b48a',skinD:'#c99a74',hair:'#d9742b',shirt:'#6ab04c',pants:'#7a5230',pantsD:'#5e3e22',eye:'#1a7a3a',mouth:'#a04a3a',long:1};
function drawFx(dt){
 if(cs.stars>.1){flies.forEach(f=>{const a=cs.stars*(.4+.6*Math.sin(time*2+f.p));if(a<.1)return;g.globalAlpha=a;
  rect(((f.x-scroll*.9+Math.sin(time+f.p)*8)%W+W)%W,f.y+Math.cos(time*1.3+f.p)*6,2,2,'#d9ff6a');g.globalAlpha=1})}
 const nr=Math.min(140,Math.floor(cs.rain*90));
 g.globalAlpha=.65;for(let i=0;i<nr;i++){const d=rain[i];d.y+=(230+d.s*90)*dt*(cs.storm>.5?1.3:1);d.x-=45*dt;if(d.y>H){d.y=-6;d.x=rnd(0,W+40)}if(d.x<-4)d.x+=W+40;
  rect(d.x,d.y,1,5,cs.stars>.5?'#9db4ff':'#cfe4ff')}
 g.globalAlpha=1;
 const ns=Math.floor(cs.snow*120);for(let i=0;i<ns;i++){const d=snow[i];d.y+=(18+d.s*24)*dt;d.x+=Math.sin(time*1.5+i)*12*dt-6*dt;if(d.y>H){d.y=-3;d.x=rnd(0,W)}if(d.x<0)d.x+=W;rect(d.x,d.y,d.s>.6?2:1,d.s>.6?2:1,'#fff')}
}
function frame(now){
 const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;time+=dt;scroll+=32*dt;updWx(dt);
 if(noiseGain)noiseGain.gain.value=muted?0:clamp(cs.rain,0,1.6)*.05;
 drawSky();drawHills();drawTrees(.6,58,0);drawGround();drawTrees(1,170,1);drawFlowers();
 drawChar(105,0,STEVE);drawChar(150,1.6,ALEX);
 drawFx(dt);
 if(cs.dark>.01){g.fillStyle=`rgba(4,6,30,${cs.dark})`;g.fillRect(0,0,W,H)}
 if(wk==='storm'&&cs.storm>.6){ltimer-=dt;if(ltimer<0){flash=1;ltimer=rnd(3,8);boltX=rnd(30,290);setTimeout(thunder,rnd(250,700))}}
 if(flash>0){if(flash>.55){let x=boltX;for(let y=0;y<GY-10;y+=10){x+=rnd(-6,6);rect(x,y,3,12,'#fff')}}
  g.fillStyle=`rgba(255,255,255,${flash*.55})`;g.fillRect(0,0,W,H);flash-=dt*2.8}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Music / weather switching ---------- */
let started=false,toastT;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
function setTrack(i,quiet){
 curT=i;const T=TR[i];wk=T.w;mi=Math.floor(T.sc.length/2);
 $('np').textContent='♪ '+T.n+' '+T.ic;if(!quiet)toast(T.ic+' '+T.n)
}
$('surp').onclick=()=>{
 initAudio();let i;do{i=Math.floor(Math.random()*TR.length)}while(i===curT);
 setTrack(i,true);toast('🎲 Surprise! '+TR[i].ic+' '+TR[i].n);chime();
};
$('mute').onclick=()=>{initAudio();muted=!muted;master.gain.value=muted?0:.7;$('mute').textContent=muted?'🔇':'🔊'};
setInterval(()=>{if(started)setTrack((curT+1)%TR.length)},50000);
setTrack(0,true);

/* ---------- Dialogue + quiz ---------- */
const bubS=$('bS'),bubA=$('bA'),panel=$('panel');
const CH={
sunny:["What a beautiful day for a walk!","Look at all those flowers!","I love the sunshine.","Do you hear the birds?"],
rain:["I love the smell of rain on grass.","Good thing puddles are fun.","Listen to the raindrops..."],
snow:["Snowflakes everywhere!","So peaceful out here in the snow.","Brr, but it looks magical!"],
night:["The stars look amazing tonight.","Watch out for creepers!","Look, fireflies!"],
storm:["Whoa, that thunder was loud!","Stay close, this is a big storm!","Lightning is cool and scary."]
};
const LEAD=["Quiz time!","Bet you can't get this one...","Okay brainiac, try this!","Here comes a tough one!","Let's test your brain!"];
const GOOD=["Awesome!","Nailed it!","Big brain!","Epic answer!"],BAD=["Oof, not quite!","So close!","Ouch, lost a heart!","Next one is yours!"];
const say=(el,who,txt,ms)=>{el.innerHTML='<b>'+who+'</b>';el.appendChild(document.createTextNode(txt));el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),ms)};
const sS=(t,ms=3500)=>say(bubS,'Steve',t,ms),sA=(t,ms=3500)=>say(bubA,'Alex',t,ms);
let qs,qi,hearts,score,streak,state,tm;
function hud(){$('hearts').innerHTML='♥'.repeat(hearts)+'<i>'+'♥'.repeat(5-hearts)+'</i>';$('score').textContent='XP '+score+(streak>1?'  🔥'+streak:'')}
function startGame(){
 qs=shuffle(Q.slice()).slice(0,25);qi=0;hearts=5;score=0;streak=0;hud();$('ov').hidden=true;walk();
}
function walk(){
 state='walk';panel.innerHTML='<div class="hint">Steve and Alex are chatting while they walk... a question is coming!</div>';
 const lines=shuffle(CH[wk].slice());
 (Math.random()<.5?sS:sA)(lines[0],3000);
 setTimeout(()=>{if(state==='walk')(Math.random()<.5?sA:sS)(pick(CH[wk]),2800)},2800);
 clearTimeout(tm);tm=setTimeout(ask,5600);
}
function ask(){
 state='ask';const q=qs[qi],asker=qi%2?'Alex':'Steve';
 (asker==='Steve'?sS:sA)(pick(LEAD),2600);
 const opts=shuffle(q[1].map((t,i)=>({t,c:i===q[2]})));
 panel.innerHTML='';
 const nm=document.createElement('div');nm.className='nm';nm.textContent=asker+' asks · Question '+(qi+1)+' of '+qs.length;
 const qq=document.createElement('div');qq.className='q';qq.textContent=q[0];
 const og=document.createElement('div');og.className='opts';
 opts.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.textContent='ABCD'[i]+') '+o.t;b.onclick=()=>answer(b,o.c,og,opts,asker);b._c=o.c;og.appendChild(b)});
 panel.append(nm,qq,og);
}
function answer(btn,ok,og,opts,asker){
 if(state!=='ask')return;state='fb';
 [...og.children].forEach(b=>{b.disabled=true;if(b._c)b.classList.add('ok')});
 const q=qs[qi],askS=asker==='Steve'?sS:sA,othS=asker==='Steve'?sA:sS;
 if(ok){score+=10+Math.min(streak,5)*2;streak++;askS(pick(GOOD),3500)}
 else{btn.classList.add('no');hearts--;streak=0;askS(pick(BAD),3500)}
 othS('Fun fact: '+q[3],5200);hud();
 const f=document.createElement('div');f.className='fact';
 const t=document.createElement('span');t.textContent=(ok?'✔ Correct! ':'✘ Not quite. ')+q[3];
 const nb=document.createElement('button');nb.className='btn surp';
 const last=qi>=qs.length-1;
 nb.textContent=hearts<=0?'CONTINUE ▶':last?'FINISH ▶':'NEXT QUESTION ▶';
 nb.onclick=()=>{qi++;if(hearts<=0||last)end(hearts>0);else walk()};
 f.append(t,nb);panel.appendChild(f);nb.focus();
}
function end(win){
 state='end';const ov=$('ov');ov.hidden=false;
 ov.innerHTML='<h2>'+(win?'YOU WIN!':'GAME OVER')+'</h2><p>'+(win?'You answered every question and kept your hearts. ':'You ran out of hearts. ')+'Final score: '+score+' XP.</p><button class="btn" id="again">▶ PLAY AGAIN</button>';
 $('again').onclick=startGame;
}
$('start').onclick=()=>{initAudio();started=true;setTrack(0);startGame()};
})();
</script>
